{% extends "base.html" %}

{% block title %}SmartCart - Add Product{% endblock %}

{% block content %}
<div class="container fade-in" style="max-width: 800px;">
    <div style="margin-bottom: 25px;">
        <a href="/admin-dashboard" style="font-weight: 500;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="card">
        <h2 class="card-title" style="border-color: var(--secondary);"><i class="fa-solid fa-square-plus" style="color: var(--secondary); margin-right: 8px;"></i> Add New Product</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Provide the necessary product specifications to publish a new item to the store catalog.</p>

        <form method="POST" action="/admin/add-item" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-tag"></i> Product Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Wireless Noise-Cancelling Headphones" required>
            </div>

            <div class="form-group">
                <label for="description"><i class="fa-solid fa-align-left"></i> Description</label>
                <textarea id="description" name="description" rows="4" class="form-control" placeholder="Provide product features, sizing, specifications..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category"><i class="fa-solid fa-folder-open"></i> Category</label>
                    <input type="text" id="category" name="category" class="form-control" placeholder="e.g. Electronics, Clothing" required>
                </div>

                <div class="form-group">
                    <label for="price"><i class="fa-solid fa-indian-rupee-sign"></i> Price (INR)</label>
                    <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="0.00" required>
                </div>
            </div>

            <div class="form-group">
                <label for="image"><i class="fa-solid fa-image"></i> Product Image</label>
                <input type="file" id="image" name="image" class="form-control" accept="image/*" required>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 35px;">
                <a href="/admin/item-list" class="btn btn-light" style="flex: 1;">
                    <i class="fa-solid fa-xmark"></i> Cancel
                </a>
                <button type="submit" class="btn btn-secondary" style="flex: 2;">
                    <i class="fa-solid fa-plus"></i> Add Product to Store
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
