{% extends "base.html" %}

{% block title %}SmartCart - Admin Login{% endblock %}

{% block content %}
<div class="container fade-in">
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h2 class="card-title" style="border-color: var(--secondary);"><span style="color: var(--secondary);">Admin</span> Portal</h2>
            
            <form method="POST" action="/admin-login">
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Admin Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@smartcart.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-secondary btn-block" style="margin-top: 10px;">
                    <i class="fa-solid fa-user-shield"></i> Admin Login
                </button>
            </form>
            
            <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
                <p>New Administrator? <a href="/admin-signup" style="font-weight: 600; color: var(--secondary);">Create Admin Account</a></p>
                <p style="margin-top: 5px; font-size: 0.8rem; color: var(--text-muted);">
                    Looking for standard shop? <a href="/user-login" style="color: var(--primary);">User Portal</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
