{% extends "base.html" %}

{% block title %}SmartCart - Verify Admin OTP{% endblock %}

{% block content %}
<div class="container fade-in">
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h2 class="card-title" style="border-color: var(--secondary);">Verify OTP</h2>
            
            <form method="POST" action="/verify-otp">
                <div class="form-group">
                    <label for="otp"><i class="fa-solid fa-key"></i> Enter OTP</label>
                    <input type="text" id="otp" name="otp" class="form-control" placeholder="6-digit verification code" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Create Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-secondary btn-block" style="margin-top: 10px;">
                    <i class="fa-solid fa-circle-check"></i> Verify & Register
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
