{% extends "base.html" %}

{% block title %}SmartCart - User Registration{% endblock %}

{% block content %}
<div class="container fade-in">
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h2 class="card-title">User Registration</h2>
            
            <form method="POST" action="/user-register">
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </form>
            
            <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
                <p>Already have an account? <a href="/user-login" style="font-weight: 600;">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
