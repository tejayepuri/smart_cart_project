{% extends "base.html" %}

{% block title %}SmartCart - Delivery Address{% endblock %}

{% block content %}
<div class="container fade-in" style="max-width: 800px;">
    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-map-location-dot" style="color: var(--primary); margin-right: 8px;"></i> Delivery Address</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Please confirm your shipping address details to proceed with checkout.</p>
        
        <form method="POST" action="/user/address">
            {% if request.args.get('next') or request.form.get('next') %}
            <input type="hidden" name="next" value="{{ request.args.get('next') or request.form.get('next') }}">
            {% endif %}

            <div class="form-row">
                <div class="form-group">
                    <label for="fullname"><i class="fa-solid fa-user"></i> Full Name</label>
                    <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Enter Full Name" required>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter Email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mobile"><i class="fa-solid fa-phone"></i> Mobile Number</label>
                    <input type="text" id="mobile" name="mobile" class="form-control" placeholder="10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label for="alternate_mobile"><i class="fa-solid fa-phone-slash"></i> Alternate Mobile</label>
                    <input type="text" id="alternate_mobile" name="alternate_mobile" class="form-control" placeholder="Optional alternate number">
                </div>
            </div>

            <div class="form-group">
                <label for="house"><i class="fa-solid fa-building"></i> House No / Flat / Apartment</label>
                <input type="text" id="house" name="house" class="form-control" placeholder="Flat No, House No, Building Name" required>
            </div>

            <div class="form-group">
                <label for="address"><i class="fa-solid fa-road"></i> Street / Area</label>
                <textarea id="address" name="address" rows="3" class="form-control" placeholder="Street Address, Colony, Sector" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="landmark"><i class="fa-solid fa-map-pin"></i> Landmark</label>
                    <input type="text" id="landmark" name="landmark" class="form-control" placeholder="e.g. Near City Mall (Optional)">
                </div>

                <div class="form-group">
                    <label for="city"><i class="fa-solid fa-city"></i> City</label>
                    <input type="text" id="city" name="city" class="form-control" placeholder="City" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="state"><i class="fa-solid fa-map"></i> State</label>
                    <input type="text" id="state" name="state" class="form-control" placeholder="State" required>
                </div>

                <div class="form-group">
                    <label for="pincode"><i class="fa-solid fa-location-arrow"></i> Pincode</label>
                    <input type="text" id="pincode" name="pincode" class="form-control" placeholder="6-digit PIN code" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address_type"><i class="fa-solid fa-tags"></i> Address Type</label>
                <select id="address_type" name="address_type" class="form-control">
                    <option>Home</option>
                    <option>Office</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 20px;">
                <input type="checkbox" id="default_address" name="default_address" value="Yes" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="default_address" style="margin-bottom: 0; cursor: pointer;">Set as Default Delivery Address</label>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <a href="/user/cart" class="btn btn-light" style="flex: 1;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Cart
                </a>
                <button type="submit" class="btn btn-primary" style="flex: 2;">
                    Confirm Address & Proceed <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
